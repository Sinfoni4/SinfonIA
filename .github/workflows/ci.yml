name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sinfonia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      SERVICE_NAME: sinfonia-ci
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sinfonia?schema=public
      AUTH_SECRET: ci-only-sinfonia-auth-secret-32chars
      AUTH_ISSUER: sinfonia
      AUTH_AUDIENCE: sinfonia-api
      AUTH_TTL_SECONDS: '3600'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Migrate database
        run: npm run db:migrate:deploy

      # MF1: separate roles; the tests below run as the least-privilege application role.
      - name: Apply database roles
        run: npm run db:roles
        env:
          DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/sinfonia
          DB_OWNER_PASSWORD: ci-only-owner-password
          DB_APP_PASSWORD: ci-only-app-password
          DB_BACKUP_PASSWORD: ci-only-backup-password

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://sinfonia_app:ci-only-app-password@localhost:5432/sinfonia?schema=public
          # Superuser only for the role test, which creates and drops its own database.
          DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/sinfonia

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
